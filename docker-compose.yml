services:
  postgres:
    image: postgres:16-alpine
    container_name: banktech_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: banktech
      POSTGRES_PASSWORD: banktechpass
      POSTGRES_DB: banktech_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U banktech -d banktech_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: banktech_backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - ENVIRONMENT=development
      - DATABASE_URL=postgresql+psycopg://banktech:banktechpass@postgres:5432/banktech_db
    volumes:
      - ./backend:/app
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: banktech_frontend
    ports:
      - "5173:80"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend

volumes:
  pgdata:
